<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MeShop</title>
  <link rel="stylesheet" href="./shop.css" />
</head>
<body>

<nav>
  <div class="brand">
    <a href="/">MeShop.</a>
  </div>

  <div class="nav-items">
    <a href="./profile.html">Home</a>
    <a href="./login.html">Login</a>
    <a href="./signUp.html">Signup</a>
    <a href="./cart.html">My Cart</a>
  </div>
</nav>

<main>

  <!-- LEFT FILTER PANEL (same UI) -->
  <aside>
    <section>
      <h3>Colors</h3>
      <ul>
        <li><input type="checkbox" /> Red</li>
        <li><input type="checkbox" /> Blue</li>
        <li><input type="checkbox" /> Green</li>
      </ul>
    </section>
  </aside>

  <!-- RIGHT SIDE -->
  <main-content>

    <input type="text" placeholder="Search"  id="searchbtn"/>

    <!-- FILTER BUTTONS -->
    <div class="filters">
      
      <div class="filter" id="men's clothing">Mens</div>
      <div class="filter active" id="all-products">All</div>
      <div class="filter" id="women's clothing">Womens</div>
      <div class="filter" id="jewelery">Jewellery</div>
      <div class="filter" id="electronics">Electronics</div>
    </div>

    <!-- 🔥 ONLY ONE DYNAMIC CONTAINER -->
    <div class="items"></div>

  </main-content>

</main>

<script src="./shop.js"></script>
</body>
</html>
