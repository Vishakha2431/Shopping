<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyShop - Welcome</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #000, #333);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      width: 320px;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }

    p {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.8;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      transition: 0.3s;
    }

    .login {
      background: #ffffff;
      color: black;
    }

    .signup {
      background: #ff4d4d;
      color: white;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .footer {
      margin-top: 15px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🛒 MyShop</h1>
    <p>Your one stop ecommerce destination</p>

    <a href="./login.html" class="btn login">Login</a>
    <a href="./signUp.html" class="btn signup">Sign Up</a>

    <div class="footer">
      Secure • Fast • Reliable
    </div>

  </div>

</body>
</html>
