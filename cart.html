<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cart</title>

  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      margin: 0;
    }

    .nav {
      background: black;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .cart-container {
      max-width: 900px;
      margin: 30px auto;
      padding: 10px;
    }

    .cart-item {
      background: white;
      margin: 12px 0;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .cart-item:hover {
      transform: scale(1.01);
    }

    .left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .cart-item img {
      width: 70px;
      height: 70px;
      object-fit: contain;
    }

    .title {
      font-size: 16px;
      font-weight: bold;
    }

    .price {
      color: green;
      margin-top: 5px;
      font-weight: bold;
    }

    button {
      padding: 8px 14px;
      border: none;
      background: red;
      color: white;
      cursor: pointer;
      border-radius: 6px;
      transition: 0.3s;
    }

    button:hover {
      background: darkred;
    }

    #total {
      text-align: center;
      font-size: 22px;
      margin-top: 20px;
      font-weight: bold;
      color: #333;
    }

    #rzp-button1 {
      display: block;
      margin: 20px auto;
      padding: 12px 25px;
      background: green;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      transition: 0.3s;
    }

    #rzp-button1:hover {
      background: darkgreen;
    }

    .empty {
      text-align: center;
      font-size: 20px;
      color: gray;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="nav">🛒 My Cart</div>

  <div id="cart-container" class="cart-container"></div>

  <h2 id="total"></h2>

  <button id="rzp-button1">Pay Now</button>

  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script src="./cart.js"></script>

</body>
</html>
